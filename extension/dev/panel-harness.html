<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IDM-Next panel harness</title>
    <style>
      body {
        margin: 0;
        background: #fff;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #111;
      }
      .chrome { background: #f1f3f4; padding: 10px 16px; border-bottom: 1px solid #dadce0; }
      .url { background: #fff; border: 1px solid #dadce0; border-radius: 20px; padding: 6px 14px; }
      .page { display: grid; grid-template-columns: 1fr 320px; gap: 22px; padding: 22px; }
      video { width: 100%; background: #000; display: block; }
      aside h3 { margin: 0 0 10px; font-size: 14px; }
      aside p { color: #555; font-size: 12.5px; }
      footer { padding: 18px 22px; color: #666; font-size: 12.5px; border-top: 1px solid #eee; }
      .docs a { display: block; padding: 4px 0; }
    </style>
  </head>
  <body>
    <div class="chrome"><span class="url">https://www.youtube.com/watch?v=pNrhAv1QC1Q</span></div>

    <div class="page">
      <main>
        <!-- Real dimensions matter: the panel hides itself on players too small
             to be the page's actual content. -->
        <video id="player" width="860" height="484" poster="" muted></video>
        <h2>Streets of Rage 2 Stage 1</h2>
        <p>Harness page. The panel above is the real content script.</p>
        <div class="docs">
          <a href="/files/annual-report-2026.pdf">annual-report-2026.pdf</a>
          <a href="/files/dataset.zip">dataset.zip</a>
        </div>
      </main>
      <aside>
        <h3>Up next</h3>
        <p>Sidebar content, to check the panel does not disturb page layout.</p>
      </aside>
    </div>

    <footer id="log">Messages sent to the background worker appear here.</footer>

    <script>
      /**
       * Minimal stand-in for the extension APIs the content script uses, so the
       * panel can be developed and reviewed in a plain browser. An unpacked
       * extension is the real test; this is for looking at it.
       */
      // Shaped like what the background worker keeps after filtering a real
      // YouTube watch page: one entry per rendition, sizes taken from
      // Content-Range, and none of the timedtext/telemetry noise.
      const GV = 'https://rr6---sn-ug5o.googlevideo.com/videoplayback?expire=1738378606';
      const FIXTURE = [
        { url: `${GV}&itag=137&mime=video%2Fmp4`, kind: 'video', size: 189_000_000, title: 'Director Musinga - Live Session', isManifest: false, contentType: 'video/mp4' },
        { url: `${GV}&itag=22&mime=video%2Fmp4`,  kind: 'video', size: 69_509_000,  title: 'Director Musinga - Live Session', isManifest: false, contentType: 'video/mp4' },
        { url: `${GV}&itag=18&mime=video%2Fmp4`,  kind: 'video', size: 24_100_000,  title: 'Director Musinga - Live Session', isManifest: false, contentType: 'video/mp4' },
        { url: `${GV}&itag=133&mime=video%2Fmp4`, kind: 'video', size: 8_900_000,   title: 'Director Musinga - Live Session', isManifest: false, contentType: 'video/mp4' },
        { url: `${GV}&itag=160&mime=video%2Fmp4`, kind: 'video', size: 4_200_000,   title: 'Director Musinga - Live Session', isManifest: false, contentType: 'video/mp4' },
        { url: `${GV}&itag=140&mime=audio%2Fmp4`, kind: 'audio', size: 3_800_000,   title: 'Director Musinga - Live Session', isManifest: false, contentType: 'audio/mp4' },
      ];

      const log = (msg) => {
        document.getElementById('log').textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
      };

      window.chrome = {
        runtime: {
          sendMessage(msg) {
            if (msg.type === 'list') return Promise.resolve({ items: FIXTURE });
            if (msg.type === 'download') {
              log(`download -> ${msg.url.slice(0, 96)}…`);
              return Promise.resolve({ ok: true });
            }
            if (msg.type === 'media-found') {
              log(`media-found -> ${msg.url} (height ${msg.height ?? 'unknown'})`);
              return Promise.resolve();
            }
            return Promise.resolve();
          },
          onMessage: { addListener() {} },
        },
        storage: {
          local: {
            get(key) {
              const val = localStorage.getItem(key);
              return Promise.resolve(val ? { [key]: JSON.parse(val) } : {});
            },
            set(obj) {
              for (const [k, v] of Object.entries(obj)) {
                localStorage.setItem(k, JSON.stringify(v));
              }
              return Promise.resolve();
            },
          },
        },
      };
    </script>
    <script src="../content.js"></script>
  </body>
</html>
